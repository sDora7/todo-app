{% extends 'base.html' %}

{% block content %}
<div class="card mt-5">
  <div class="card-body">
    <h3>{{ object.title }}</h3>
    <p>{{ object.description }}</p>
    <p class="text-muted">{{ object.deadline }}</p>
    {% if user.is_authenticated %}
    <a href="{% url 'task-update' object.pk %}" class="btn btn-outline-success">編集</a>
    <a href="{% url 'task-delete' object.pk %}" class="btn btn-outline-danger">削除</a>
    {% endif %}
  </div>
</div>

{% endblock content %}
